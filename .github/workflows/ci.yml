# Gate every push and PR on the checks that are already green locally.
# --ignore-scripts skips the electron-rebuild postinstall (node-pty native
# build) — no test imports node-pty, and a signed dist build is a separate
# manual concern, not this gate. dugite's git binary still needs a manual
# fetch since --ignore-scripts also skips its postinstall under pnpm.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # --ignore-scripts also skips dugite's postinstall, but the self-mod git
      # tests need its embedded git binary — fetch just that one.
      - run: node node_modules/dugite/script/download-git.js
      # routeTree.gen.ts is gitignored; a clean checkout has none until the
      # TanStack plugin runs, so generate it before typecheck.
      - run: pnpm run routes:gen
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # libappindicator3-dev and libayatana-appindicator3-dev conflict on
      # noble/24.04 runners — only the ayatana one is needed there.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
