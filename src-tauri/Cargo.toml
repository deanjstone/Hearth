[package]
name = "hearth"
version = "0.1.0"
description = "Hearth desktop client (Tauri port)"
authors = ["you"]
edition = "2021"

[lib]
name = "hearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features off: the overlay client only ever posts to the local Vite dev
# server over plain http://, so the tls stack ureq pulls in by default is dead
# weight here.
ureq = { version = "2", default-features = false, features = ["json"] }
# Raw kill(2) for process-group termination in validate.rs — shelling out to the
# `kill` binary for a negative-pid (group) target was observed to silently no-op
# in this dev environment (reports success, never signals the group); calling
# the syscall directly is both more robust and avoids spawning an extra process.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
