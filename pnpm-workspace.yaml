packages:
  - .
  - e2e-tests

allowBuilds:
  dugite: true
  node-pty: true
  # Packaging is out of scope for this dev-mode-only port (see map Destination);
  # electron-winstaller's build script is Windows-installer-only and unneeded.
  electron-winstaller: false
  # esbuild ships prebuilt platform binaries via optionalDependencies; its
  # postinstall is a no-op verification step on linux-x64, confirmed working
  # (`esbuild --version`) without running it.
  esbuild: false
  # Transitive deps of @wdio/tauri-service's browser-driver-manager tooling, for
  # testing Edge/Firefox — Hearth only ever drives WebKitGTK via tauri-driver, so
  # these postinstall binary downloads are unused.
  edgedriver: false
  geckodriver: false

minimumReleaseAgeExclude:
  - '@wdio/tauri-service@1.3.0'
